version: "3.8"

services:
  redis:
    image: redis:7-alpine
    container_name: tms-line-provider-redis
    restart: always
    ports:
      - "6379:6379"
    networks:
      - line-provider

  tms-line-provider:
    platform: linux/amd64
    build: .
    image: registry.gitlab.com/jostechnology/tms-line-provider:${TAG}
    container_name: tms-line-provider
    restart: always
    ports:
      - "8092:5002"
    environment:
      - ADMIN_TOKEN=${ADMIN_TOKEN}
      - SERVICE_BASE_URL=${SERVICE_BASE_URL}
      - DATABASE_URL=${DATABASE_URL}
      - REDIS_URL=redis://redis:6379/0
      # LINE Login channel for the account-linking flow (folded in from the old
      # mock_auth_server). Callback is {SERVICE_BASE_URL}/auth/line/callback.
      - LINE_CLIENT_ID=${LINE_CLIENT_ID}
      - LINE_CLIENT_SECRET=${LINE_CLIENT_SECRET}
    volumes:
      - "/etc/localtime:/etc/localtime:ro"
      - "/usr/share/zoneinfo:/usr/share/zoneinfo:ro"
    networks:
      - line-provider

networks:
  line-provider:
    driver: bridge